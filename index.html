<title>Sapancadayım</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
  /* Tek temaya bağlı, bilerek: beyaz zemin marka kimliğinin parçası.
     Bu yüzden her renk açıkça boyanıyor, hiçbiri host temasından miras alınmıyor. */
  :root {
    --ground: #FFFFFF;
    --ink: #0C2A22;
    --muted: #64796F;
    --brand: #059669;
    --line: #E4EBE6;
    --display: "Baloo 2", "Trebuchet MS", sans-serif;
    --body: "Source Sans 3", -apple-system, "Segoe UI", sans-serif;
  }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 560px;
    margin: 0 auto;
    padding-inline: 24px;
    padding-block: 96px 48px;
    display: flex;
    flex-direction: column;
    gap: 30px;
    align-items: flex-start;
  }
  img.mark { width: 250px; max-width: 74%; height: auto; }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 9px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--brand);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); }

  h1 {
    font-family: var(--display); font-weight: 800;
    font-size: clamp(27px, 5.6vw, 36px); line-height: 1.16; margin: 0;
    text-wrap: balance; letter-spacing: -0.01em; max-width: 18ch;
  }
  p { margin: 0; color: var(--muted); max-width: 46ch; }

  .badges { display: flex; flex-wrap: wrap; gap: 10px; }
  .badge {
    display: inline-flex; align-items: center; gap: 10px;
    border: 1px solid var(--line); border-radius: 11px;
    padding: 9px 15px 9px 12px; background: var(--ground); color: var(--ink);
  }
  .badge-text { display: flex; flex-direction: column; line-height: 1.12;
    font-family: var(--display); font-weight: 600; font-size: 15px; }
  .badge-text small { font-family: var(--body); font-weight: 400; font-size: 10px;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

  a { color: var(--brand); text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a:hover { color: var(--ink); }
  a:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; border-radius: 3px; }

  footer { width: 100%; margin-top: 10px; padding-top: 20px; border-top: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14.5px; color: var(--muted); }
  footer b { font-family: var(--display); font-weight: 600; color: var(--ink); }

  @media (max-width: 480px) { .page { padding-block: 64px 40px; gap: 26px; } }
</style>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  img { max-width: 100%; }
</style>
</head>
