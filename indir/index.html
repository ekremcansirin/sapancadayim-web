<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="sapancadayım uygulamasını indir. Telefonunu tanır, seni App Store ya da Google Play'e götürür.">
<meta name="robots" content="index, follow">
<meta property="og:title" content="Uygulamayı indir — Sapancadayım">
<meta property="og:description" content="Sapanca'nın dijital rehberi. App Store ve Google Play'de.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sapancadayim.com/indir/">
<meta property="og:locale" content="tr_TR">
<meta name="theme-color" content="#ffffff">
<link rel="canonical" href="https://sapancadayim.com/indir/">
<title>Uygulamayı indir — Sapancadayım</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .page {
    max-width: 560px;
    margin: 0 auto;
    padding-inline: 24px;
    padding-block: 88px 48px;
    display: flex;
    flex-direction: column;
    gap: 26px;
    align-items: flex-start;
  }
  img.mark { width: 220px; max-width: 70%; height: auto; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 9px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--brand);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); }
  h1 {
    font-family: var(--display); font-weight: 800;
    font-size: clamp(27px, 5.6vw, 36px); line-height: 1.16; margin: 0;
    text-wrap: balance; letter-spacing: -0.01em; max-width: 18ch;
  }
  p { margin: 0; color: var(--muted); max-width: 46ch; }

  .badges { display: flex; flex-wrap: wrap; gap: 10px; }
  /* Aynı kutu hem link hem de "yakında" etiketi olabiliyor; ikisi de .badge. */
  .badge {
    display: inline-flex; align-items: center; gap: 10px;
    border: 1px solid var(--line); border-radius: 11px;
    padding: 9px 15px 9px 12px; background: var(--ground); color: var(--ink);
  }
  a.badge { text-decoration: none; }
  a.badge:hover { border-color: var(--brand); color: var(--ink); }
  a.badge:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
  .badge-text { display: flex; flex-direction: column; line-height: 1.12;
    font-family: var(--display); font-weight: 600; font-size: 15px; }
  .badge-text small { font-family: var(--body); font-weight: 400; font-size: 10px;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

  footer { width: 100%; margin-top: 10px; padding-top: 20px; border-top: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14.5px; color: var(--muted); }
  footer b { font-family: var(--display); font-weight: 600; color: var(--ink); }

  @media (max-width: 480px) { .page { padding-block: 60px 40px; gap: 22px; } }
</style>
</head>
<body>

<div class="page">
  <img class="mark" src="/assets/logo.png" alt="sapancadayım">

  <span class="eyebrow"><span class="dot"></span><span id="eyebrow">Uygulamayı indir</span></span>

  <h1 id="baslik">Sapanca&rsquo;nın dijital rehberi.</h1>

  <p id="aciklama">Kahvaltıdan bungalova, nöbetçi eczaneden tren saatine kadar
  Sapanca&rsquo;da ihtiyacın olan her şey tek uygulamada.</p>

  <div class="badges" id="rozetler">
    <!-- Mağaza linkleri yayınlanınca script bu kutuları <a>'ya çeviriyor.
         Linkler yokken kutu tıklanamaz kalıyor: ölü link yok. -->
    <span class="badge" id="rozet-ios" aria-label="Yakında App Store&rsquo;da">
      <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
        <path fill="currentColor" d="M16.2 12.6c0-2.2 1.8-3.3 1.9-3.3-1-1.5-2.7-1.7-3.3-1.7-1.4-.1-2.7.8-3.4.8-.7 0-1.8-.8-2.9-.8-1.5 0-2.9.9-3.7 2.2-1.6 2.7-.4 6.8 1.1 9 .8 1.1 1.6 2.3 2.8 2.2 1.1 0 1.5-.7 2.9-.7 1.3 0 1.7.7 2.9.7 1.2 0 1.9-1.1 2.7-2.2.8-1.2 1.2-2.4 1.2-2.5 0 0-2.2-.9-2.2-3.7zM14 5.8c.6-.8 1-1.8.9-2.8-.9 0-2 .6-2.6 1.3-.6.7-1.1 1.7-.9 2.7 1 .1 2-.5 2.6-1.2z"/>
      </svg>
      <span class="badge-text"><small id="ust-ios">Yakında</small>App Store</span>
    </span>
    <span class="badge" id="rozet-android" aria-label="Yakında Google Play&rsquo;de">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path fill="#34A853" d="M3.9 2.1 14.7 12 3.9 21.9c-.5-.3-.9-.9-.9-1.6V3.7c0-.7.4-1.3.9-1.6z"/>
        <path fill="#FBBC04" d="M18.6 8.6 14.7 12l3.9 3.4 3-1.7c.9-.5.9-1.9 0-2.4l-3-1.7z"/>
        <path fill="#EA4335" d="M3.9 2.1c.4-.2.9-.2 1.4.1l13.3 6.4L14.7 12 3.9 2.1z"/>
        <path fill="#4285F4" d="M3.9 21.9 14.7 12l3.9 3.4L5.3 21.8c-.5.3-1 .3-1.4.1z"/>
      </svg>
      <span class="badge-text"><small id="ust-android">Yakında</small>Google Play</span>
    </span>
  </div>

  <footer>
    <b>sapancadayim.com</b>
    <span>Sapanca, Sakarya</span>
    <a href="mailto:info@sapancadayim.com">info@sapancadayim.com</a>
    <a href="/gizlilik/">Gizlilik Politikası</a>
    <a href="/destek/">Destek</a>
  </footer>
</div>

<script>
/* ---------------------------------------------------------------
   TEK DEĞİŞTİRİLECEK YER.
   Uygulama mağazalarda yayınlanınca aşağıdaki iki satırı doldur.
   Dolu olan mağaza için: o telefondan gelen kullanıcı doğrudan
   yönlendirilir, masaüstünde rozet tıklanabilir link olur.
   null kalırsa o mağaza "Yakında" olarak durur, ölü link üretilmez.

   Android linki yayından sonra şu olacak:
   "https://play.google.com/store/apps/details?id=com.sapancadayim.app"
   iOS linki App Store Connect'te uygulama kaydı açılınca belli olur
   (apps.apple.com/tr/app/<isim>/id<APPLE_ID>).
--------------------------------------------------------------- */
var MAGAZA = {
  ios: null,
  android: null
};

(function () {
  var ua = navigator.userAgent || "";
  // iPadOS 13+ kendini Mac gibi tanıtıyor; dokunmatik varlığıyla ayırt ediliyor.
  var iPadMasaustuKilikli = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
  var platform = /iPhone|iPad|iPod/.test(ua) || iPadMasaustuKilikli ? "ios"
               : /Android/.test(ua) ? "android"
               : null;

  function rozetiLinkeCevir(hangi) {
    var hedef = MAGAZA[hangi];
    if (!hedef) return;
    var eski = document.getElementById("rozet-" + hangi);
    var yeni = document.createElement("a");
    yeni.className = "badge";
    yeni.href = hedef;
    yeni.rel = "noopener";
    yeni.innerHTML = eski.innerHTML;
    yeni.setAttribute("aria-label",
      hangi === "ios" ? "App Store’dan indir" : "Google Play’den indir");
    eski.replaceWith(yeni);
    document.getElementById("ust-" + hangi).textContent = "İndir";
  }

  rozetiLinkeCevir("ios");
  rozetiLinkeCevir("android");

  // Telefondan gelindiyse ve o mağaza yayındaysa doğrudan götür.
  // replace kullanılıyor: geri tuşu kullanıcıyı bu sayfaya hapsetmesin.
  if (platform && MAGAZA[platform]) {
    document.getElementById("eyebrow").textContent = "Yönlendiriliyorsun";
    document.getElementById("aciklama").textContent =
      "Mağaza açılmazsa aşağıdaki butona dokun.";
    window.location.replace(MAGAZA[platform]);
    return;
  }

  // Henüz yayında değil: beklentiyi doğru kur.
  if (!MAGAZA.ios && !MAGAZA.android) {
    document.getElementById("eyebrow").textContent = "Yakında";
    document.getElementById("aciklama").textContent =
      "Uygulama yayına hazırlanıyor. App Store ve Google Play'de çıktığı an bu sayfa " +
      "seni doğrudan telefonuna uygun mağazaya götürecek.";
  }
})();
</script>

</body>
</html>
